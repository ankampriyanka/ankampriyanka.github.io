<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
  <title id="title">AI Governance Debt compounds as AI adoption outpaces governance capability</title>
  <desc id="desc">A conceptual visual showing an AI portfolio scaling from 10 to 150 systems while governance capability grows more slowly, creating a widening governance debt gap.</desc>
  <rect width="1000" height="600" rx="24" fill="#f8fafc"/>
  <text x="70" y="72" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#0f172a">When AI adoption outpaces governance capability</text>
  <text x="70" y="106" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#64748b">The gap between what the AI portfolio requires and what governance can support becomes debt.</text>

  <line x1="100" y1="500" x2="910" y2="500" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="100" y1="500" x2="100" y2="155" stroke="#cbd5e1" stroke-width="2"/>

  <path d="M100 475 C260 455 390 405 505 335 C650 245 775 180 900 145 L900 420 C760 430 635 445 505 455 C360 468 225 478 100 480 Z" fill="#fbbf24" opacity="0.28"/>
  <path d="M100 480 C280 475 430 460 570 445 C700 432 805 425 900 420" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
  <path d="M100 475 C260 455 390 405 505 335 C650 245 775 180 900 145" fill="none" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>

  <circle cx="100" cy="478" r="8" fill="#0f172a"/>
  <circle cx="505" cy="335" r="8" fill="#0f172a"/>
  <circle cx="900" cy="145" r="8" fill="#0f172a"/>

  <text x="650" y="166" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0f172a">AI portfolio / capability</text>
  <text x="640" y="446" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#334155">Governance capability</text>

  <text x="285" y="397" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#92400e">AI Governance Debt</text>
  <text x="285" y="423" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#a16207">Widening gap as the portfolio scales</text>

  <rect x="116" y="525" width="155" height="40" rx="20" fill="#e2e8f0"/>
  <text x="193" y="551" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#334155">10 systems</text>
  <rect x="762" y="525" width="155" height="40" rx="20" fill="#e2e8f0"/>
  <text x="839" y="551" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#334155">150 systems</text>
  <text x="465" y="551" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#64748b">Time / portfolio growth</text>
</svg>
