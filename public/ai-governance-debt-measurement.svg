<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
  <title id="title">A six-dimensional model for measuring AI Governance Debt</title>
  <desc id="desc">Six dimensions make AI Governance Debt observable: governance coverage, assessment coverage, control coverage, evidence completeness, remediation backlog and governance freshness.</desc>
  <rect width="1000" height="650" rx="24" fill="#f8fafc"/>
  <text x="70" y="62" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Measuring AI Governance Debt</text>
  <text x="70" y="94" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#64748b">A portfolio-level view of the gap between required and effective governance capability.</text>
  <circle cx="500" cy="355" r="104" fill="#fffbeb" stroke="#f59e0b" stroke-width="3"/>
  <text x="500" y="343" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#92400e">AI Governance</text>
  <text x="500" y="374" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#92400e">Debt</text>
  <text x="500" y="403" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#a16207">portfolio-level gap</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="65" y="155" width="245" height="112" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="88" y="187" font-size="17" font-weight="700" fill="#0f172a">01 · Governance coverage</text>
    <text x="88" y="214" font-size="13" fill="#64748b">Is the AI portfolio known, owned,</text><text x="88" y="234" font-size="13" fill="#64748b">classified and covered?</text>

    <rect x="378" y="130" width="245" height="112" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="401" y="162" font-size="17" font-weight="700" fill="#0f172a">02 · Assessment coverage</text>
    <text x="401" y="189" font-size="13" fill="#64748b">Have required risk, impact, model</text><text x="401" y="209" font-size="13" fill="#64748b">and third-party assessments occurred?</text>

    <rect x="690" y="155" width="245" height="112" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="713" y="187" font-size="17" font-weight="700" fill="#0f172a">03 · Control coverage</text>
    <text x="713" y="214" font-size="13" fill="#64748b">Are required controls implemented</text><text x="713" y="234" font-size="13" fill="#64748b">and operating?</text>

    <rect x="65" y="450" width="245" height="112" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="88" y="482" font-size="17" font-weight="700" fill="#0f172a">04 · Evidence completeness</text>
    <text x="88" y="509" font-size="13" fill="#64748b">Can the organization demonstrate</text><text x="88" y="529" font-size="13" fill="#64748b">that controls are operating?</text>

    <rect x="378" y="475" width="245" height="112" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="401" y="507" font-size="17" font-weight="700" fill="#0f172a">05 · Remediation backlog</text>
    <text x="401" y="534" font-size="13" fill="#64748b">How much known governance work</text><text x="401" y="554" font-size="13" fill="#64748b">remains unresolved?</text>

    <rect x="690" y="450" width="245" height="112" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="713" y="482" font-size="17" font-weight="700" fill="#0f172a">06 · Governance freshness</text>
    <text x="713" y="509" font-size="13" fill="#64748b">How quickly does governance</text><text x="713" y="529" font-size="13" fill="#64748b">information become outdated?</text>
  </g>

  <g stroke="#fbbf24" stroke-width="3" opacity="0.8">
    <line x1="310" y1="220" x2="415" y2="305"/><line x1="500" y1="242" x2="500" y2="251"/><line x1="690" y1="220" x2="585" y2="305"/>
    <line x1="310" y1="495" x2="415" y2="405"/><line x1="500" y1="475" x2="500" y2="459"/><line x1="690" y1="495" x2="585" y2="405"/>
  </g>
</svg>
